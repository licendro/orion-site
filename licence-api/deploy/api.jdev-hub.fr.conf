# Nginx : /etc/nginx/sites-available/api.jdev-hub.fr
# Puis : ln -s /etc/nginx/sites-available/api.jdev-hub.fr /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#        certbot --nginx -d api.jdev-hub.fr   (ajoute HTTPS et la redirection automatiquement)

limit_req_zone $binary_remote_addr zone=orion_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.jdev-hub.fr;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        limit_req zone=orion_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # L'API lit l'IP du serveur FiveM ici (jamais envoyée par le client)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # L'administration n'est accessible qu'au site (même machine, via 127.0.0.1:3020)
    location /v1/admin/ { return 404; }
}
