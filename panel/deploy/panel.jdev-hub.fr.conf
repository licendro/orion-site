# Nginx : /etc/nginx/sites-available/panel.jdev-hub.fr
#   ln -s /etc/nginx/sites-available/panel.jdev-hub.fr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d panel.jdev-hub.fr
limit_req_zone $binary_remote_addr zone=panel_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.jdev-hub.fr;
    server_tokens off;
    client_max_body_size 100m;          # envoi de fichiers jusqu'à 100 Mo

    # (Facultatif, très conseillé) n'autoriser que ton IP :
    # allow 1.2.3.4;
    # deny all;

    location = /api/login {
        limit_req zone=panel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
